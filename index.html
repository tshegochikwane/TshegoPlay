<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#090a1f">
<title>Campus Ambassador Portfolio · Power Play</title>
<style>
/* ===== EDIT THE LOOK HERE (swap in the official Power Play colours if you have them) ===== */
:root{
  --bg:#090a1f; --bg2:#15113a;
  --lime:#ff8a00; --pink:#ff2d8f; --cyan:#ffb347; --amber:#ffb300;
  --ink:#f4f6ff; --muted:#a9afd6; --glass:rgba(14,14,44,.78);
  --head:Impact,"Arial Black","Haettenschweiler","Franklin Gothic Heavy",sans-serif;
  --body:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;touch-action:none}
canvas{display:block;position:absolute;inset:0;touch-action:none}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);z-index:10;pointer-events:none}
.hud-l,.hud-c,.hud-r{display:flex;flex-direction:column;gap:4px}
.hud-l{min-width:90px}
.hud-c{align-items:center;flex:1}
.hud-r{flex-direction:row;gap:6px;pointer-events:auto}
#hearts{color:var(--pink);font-size:20px;letter-spacing:2px;text-shadow:0 0 10px rgba(255,45,143,.7)}
#cellsTxt{font-family:var(--head);font-size:20px;color:var(--lime);text-shadow:0 0 10px rgba(255,138,0,.6);letter-spacing:.04em}
#scoreTxt{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
#prog{display:flex;gap:4px}
.seg{width:clamp(14px,3.4vw,34px);height:8px;border-radius:5px;background:rgba(255,255,255,.18);transition:.3s}
.seg.on{background:var(--lime);box-shadow:0 0 10px var(--lime)}
.seg.cur{background:rgba(255,138,0,.45)}
#lvlTxt{font-size:11px;letter-spacing:.18em;font-weight:800;color:var(--muted)}
.ib{width:42px;height:42px;border-radius:12px;background:var(--glass);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:16px;font-weight:800;cursor:pointer;backdrop-filter:blur(6px)}
.ib:active{transform:scale(.92)}
.ib.off{opacity:.45;text-decoration:line-through}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:9;pointer-events:none;
  background:var(--glass);border:1px solid rgba(255,138,0,.5);color:var(--ink);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:.06em;
  width:max-content;max-width:92vw;text-align:center;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}

/* Overlays */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  background:radial-gradient(ellipse at center,rgba(9,10,31,.55),rgba(9,10,31,.88));backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#modal{z-index:30}
.card{width:min(580px,100%);max-height:min(90dvh,820px);max-height:min(90vh,820px);overflow:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(160deg,rgba(34,26,92,.97),rgba(12,12,40,.97));border:2px solid rgba(255,138,0,.55);border-radius:22px;padding:22px;
  box-shadow:0 20px 80px rgba(0,0,0,.6),0 0 40px rgba(255,138,0,.15);animation:pop .4s cubic-bezier(.2,1.4,.4,1);-webkit-user-select:text;user-select:text;touch-action:pan-y}
.card.wide{width:min(760px,100%)}
@keyframes pop{from{transform:scale(.88) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.tag{display:inline-block;font-weight:900;letter-spacing:.14em;font-size:.7rem;color:#10122e;background:var(--lime);padding:.35em .9em;border-radius:99px}
h1,h2{font-family:var(--head);text-transform:uppercase;font-style:italic;letter-spacing:.02em;margin:.5rem 0 .4rem;line-height:1.02}
h2{font-size:clamp(1.7rem,5.6vw,2.5rem)}
.card p{line-height:1.55;color:#dfe3ff;margin:.55rem 0;font-size:clamp(.95rem,2.6vw,1.05rem)}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{border:1.5px solid rgba(255,179,71,.7);color:#ffe2b8;border-radius:99px;padding:.3em .85em;font-size:.82rem;font-weight:800;background:rgba(255,179,71,.08)}
.todo{background:repeating-linear-gradient(45deg,#ffb300 0 6px,#ffcc4d 6px 12px);color:#2a1d00;padding:0 .4em;border-radius:5px;font-weight:800;font-size:.92em}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{font:800 1rem var(--body);padding:.95em 1.7em;border-radius:99px;border:0;cursor:pointer;text-transform:uppercase;letter-spacing:.09em;text-decoration:none;display:inline-block;text-align:center;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--lime),#ffb347);color:#10122e;box-shadow:0 0 0 3px rgba(255,138,0,.25),0 10px 30px rgba(255,138,0,.35);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,138,0,.12),0 10px 36px rgba(255,138,0,.5)}}
.btn.ghost{background:transparent;border:2px solid rgba(255,255,255,.35);color:var(--ink)}
.btn.small{padding:.7em 1.2em;font-size:.85rem}
.idea{border:1.5px solid rgba(255,255,255,.2);border-radius:14px;margin:10px 0;padding:2px 14px;background:rgba(255,255,255,.04)}
.idea summary{cursor:pointer;font-weight:900;padding:12px 0;color:var(--lime);letter-spacing:.04em;list-style:none}
.idea summary::before{content:"▶  ";color:var(--pink);font-size:.8em}
.idea[open] summary::before{content:"▼  "}
.idea summary::-webkit-details-marker{display:none}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.photos figure{margin:0;border-radius:14px;overflow:hidden;border:1.5px solid rgba(255,255,255,.2);aspect-ratio:1/1;position:relative;background:linear-gradient(135deg,#251a6b,#0f0c33)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:.75rem;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.photos figure.empty img{display:none}
.photos figure.empty::before{content:"ADD PHOTO\A" attr(data-file);white-space:pre;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.72rem;font-weight:800;letter-spacing:.08em;color:var(--amber);padding:8px}
.scoreline{font-family:var(--head);font-size:1.4rem;color:var(--lime);letter-spacing:.05em;margin-top:10px}

/* start screen */
#start .inner{text-align:center;max-width:640px}
.kicker{font-weight:900;letter-spacing:.22em;font-size:clamp(.65rem,2.3vw,.85rem);color:var(--lime)}
#start h1{font-size:clamp(2.4rem,11vw,5.2rem);background:linear-gradient(90deg,#fff,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 24px rgba(255,179,71,.35))}
#start .sub{color:#dfe3ff;font-size:clamp(.95rem,3vw,1.15rem);margin:.2rem 0 1rem}
#start .actions{justify-content:center}
#can{width:min(120px,18vh);height:auto;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(255,179,71,.55))}
@keyframes float{50%{transform:translateY(-12px) rotate(4deg)}}
#can svg{display:block;width:100%;height:auto}
.small-note{color:var(--muted);font-size:.8rem;margin-top:14px;letter-spacing:.05em}

/* trophy room */
#roomGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:14px 0}
.tile{position:relative;text-align:left;border-radius:16px;border:2px solid rgba(255,138,0,.55);background:linear-gradient(160deg,#2a1f78,#14104a);color:var(--ink);padding:14px;cursor:pointer;min-height:104px;font-family:var(--body)}
.tile b{display:block;font-family:var(--head);font-size:1.7rem;color:var(--lime);font-style:italic}
.tile span{font-weight:800;font-size:.9rem;line-height:1.2;display:block}
.tile.locked{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:var(--muted);cursor:not-allowed}
.tile.locked b{color:var(--muted)}
.tile.locked::after{content:"LOCKED";position:absolute;right:10px;top:12px;font-size:.62rem;font-weight:900;letter-spacing:.14em}
.tile:not(.locked):hover{transform:translateY(-3px)}


/* flavour strip */
.flv{display:flex;gap:14px;align-items:center;margin:12px 0 4px;padding:12px 14px;border-radius:16px;border:1.5px solid rgba(255,255,255,.2);background:linear-gradient(120deg,rgba(255,255,255,.08),rgba(255,255,255,.02))}
.canwrap{position:relative;flex:0 0 72px;width:72px;aspect-ratio:3/5;animation:float 3s ease-in-out infinite}
.canwrap svg,.canwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.flv .fk{font-size:.66rem;letter-spacing:.18em;font-weight:900;color:var(--amber)}
.flv .fn{font-family:var(--head);font-size:1.6rem;text-transform:uppercase;font-style:italic;line-height:1.05;margin:2px 0}
.flv p{margin:.25rem 0 0!important;font-size:.92rem!important;line-height:1.4!important}

/* recharge scene */
.scene{position:relative;width:100%;aspect-ratio:360/190;margin:10px 0 6px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,rgba(7,7,28,.7),rgba(122,29,140,.35));border:1.5px solid rgba(255,255,255,.18)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene .stu,.scene .hlp,.scene .can2{transition:transform .9s cubic-bezier(.4,.1,.3,1),opacity .5s}
.scene .stu{transform:translate(105px,172px)}
.scene .hlp{transform:translate(430px,172px)}
.scene .can2{transform:translate(394px,112px)}
.scene.a1 .hlp{transform:translate(215px,172px)}
.scene.a1 .can2{transform:translate(179px,112px)}
.scene.a2 .can2{transform:translate(121px,98px)}
.scene.a3 .can2{transform:translate(121px,94px) rotate(-50deg)}
.scene.a4 .can2{transform:translate(121px,98px);opacity:0}
.scene .eyesA,.scene .mA,.scene .spark,.scene .fizz{opacity:0}
.scene.a4 .eyesA,.scene.a4 .mA{opacity:1}
.scene.a4 .eyesT,.scene.a4 .mT,.scene.a4 .zzz{opacity:0}
.scene.a3 .fizz{opacity:1;animation:rise .7s ease-in infinite}
.scene.a4 .spark{opacity:1;animation:tw .9s ease-in-out infinite alternate}
.scene.a1:not(.a2) .bob2{animation:walk .3s ease-in-out 5}
.zzz{animation:zz 1.6s ease-in-out infinite}
@keyframes zz{50%{transform:translateY(-6px);opacity:.4}}
@keyframes walk{50%{transform:translateY(-4px)}}
@keyframes rise{from{transform:translateY(4px);opacity:1}to{transform:translateY(-8px);opacity:0}}
@keyframes tw{from{opacity:.3}to{opacity:1}}
.bub{position:absolute;background:#fff;color:#10122e;font-weight:800;font-size:clamp(.72rem,2.6vw,.95rem);padding:.45em .8em;border-radius:14px;max-width:48%;line-height:1.2;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:pop .3s}
.bub::after{content:"";position:absolute;bottom:-7px;width:0;height:0;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.bubL{left:4%;top:5%}.bubL::after{left:36%}
.bubR{right:3%;top:5%}.bubR::after{right:26%}
.sfx{position:absolute;left:50%;top:6%;z-index:3;pointer-events:none;
  font-family:var(--head);font-style:italic;font-size:clamp(2.2rem,11vw,3.6rem);letter-spacing:.04em;
  color:var(--lime);-webkit-text-stroke:2px #10122e;paint-order:stroke fill;
  text-shadow:0 0 18px rgba(255,138,0,.85);
  transform:translateX(-50%) rotate(-6deg);animation:sfxpop .45s cubic-bezier(.2,1.7,.4,1)}
@keyframes sfxpop{from{transform:translateX(-50%) rotate(-6deg) scale(.2);opacity:0}
  to{transform:translateX(-50%) rotate(-6deg) scale(1);opacity:1}}
.rchearts{display:flex;gap:10px;justify-content:center;font-size:2rem;color:var(--pink);text-shadow:0 0 12px rgba(255,45,143,.7)}
.rchearts span.on{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.rclabel{text-align:center;font-weight:900;letter-spacing:.14em;font-size:.75rem;color:var(--lime);min-height:1.2em}

.scene .tsh{position:absolute;left:-24%;bottom:5%;width:20%;transition:left 1s cubic-bezier(.3,.1,.3,1)}
.scene .tsh svg{position:static;width:100%;height:auto;display:block}
.scene .ridee{position:absolute;right:-32%;bottom:7%;font-size:clamp(3rem,15vw,5rem);line-height:1;transition:right 1.1s .4s cubic-bezier(.3,.1,.3,1)}
.scene.go .tsh{left:22%}.scene.go .ridee{right:20%}
.scene.intro{aspect-ratio:360/230}
@media (max-width:520px){.hud-l{min-width:72px}.card{padding:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript><p style="padding:24px">Please turn on JavaScript to play this portfolio.</p></noscript>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div class="hud-l"><div id="hearts"></div><div id="cellsTxt"></div><div id="scoreTxt"></div></div>
    <div class="hud-c"><div id="prog"></div><div id="lvlTxt"></div></div>
    <div class="hud-r">
      <button class="ib" id="bSound" aria-label="Toggle sound">♪</button>
      <button class="ib" id="bPause" aria-label="Pause">II</button>
      <button class="ib" id="bRoom" aria-label="Trophy room">★</button>
    </div>
  </div>

  <div id="hint" hidden>TAP or SPACE to jump · tap again mid-air to double jump</div>

  <div class="overlay" id="start">
    <div class="inner">
      <div id="can" aria-hidden="true"></div>
      <div class="kicker">POWER PLAY · CAMPUS AMBASSADOR PORTFOLIO</div>
      <h1 id="startName">Her Name</h1>
      <p class="sub" id="startTag"></p>
      <div class="actions">
        <button class="btn primary" id="bPlay">▶ Press Play</button>
        <button class="btn ghost" id="bSkip">Skip to portfolio</button>
      </div>
      <p class="small-note">A new mini-game on every level. Win each one to unlock a part of the portfolio. <span id="bestTxt"></span></p>
    </div>
  </div>

  <div class="overlay" id="room" hidden>
    <div class="card wide">
      <span class="tag">TROPHY ROOM</span>
      <h2>The Portfolio</h2>
      <p class="muted">Every checkpoint you clear in the game unlocks a piece of the portfolio.</p>
      <div id="roomGrid"></div>
      <div id="roomDocs" class="actions" style="margin-top:0"></div>
      <div class="actions">
        <button class="btn primary" id="roomClose">Close</button>
        <button class="btn ghost" id="roomUnlock">Unlock everything</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modal" hidden><div class="card" id="modalCard"></div></div>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   EDIT ME — everything she wants to say lives in this block.
   Anything written like [[this]] shows as a yellow "to-do" tag until replaced.
   ===================================================================== */
const PROFILE = {
  name: "Tshegofatso Chikwane",
  tagline: "Data Science student · Innovator · Campus connector",
  helperName: "Tshegofatso",          /* the friend who hands her a Play in the recharge scene */
  playerImg: "images/can.png",        /* OPTIONAL: photo/cut-out of a real Play can (PNG). If the file exists, the runner becomes that can */
  docs: [                             /* put these files in a folder called "docs" next to this file */
    {label:"Download CV",        file:"docs/cv.pdf"},

  ],
  contact: {
    email:        "tshegochikwane02@gmail.com",
    studentEmail: "202453703@spu.ac.za",
    phone:        "+27 67 213 8437",
    instagram: "https://www.instagram.com/mfanakazi_",
    tiktok:    "https://www.tiktok.com/@mfanakazi_",
    linkedin:  "https://www.linkedin.com/in/tshegofatso-tshepang-kimberly-chikwane-98a05a346/"
  },
  /* Put her pictures in a folder called "images" next to this file with these names */
  photos: [
    {src:"images/1.jpeg", cap:"Celebration hour"},
    {src:"images/play-2.jpg", cap:"Soft green"},
    {src:"images/2.jpeg", cap:"Sunshine mood"},
    {src:"images/4.jpeg", cap:"Bun day"},
    {src:"images/6.jpeg", cap:"Club engagements"},
    {src:"images/5.jpeg", cap:"Data Analysis"}
  ],
  cards: [
    { tag:"LEVEL 1 · PLAYER SELECT", game:"run", title:"Meet {name}", flavour:{name:"Original", c1:"#ff9a2e", c2:"#e04a00", photo:"images/OG.webp",
        lines:["Classic sweet and tangy energy flavour.","Also comes in a smaller 250ml can."]},
      body:[
        "HEY, I'M TSHEGO! 👋🏽",
        "I am Tshegofatso Chikwane, but most people call me Tshego. I'm a second-year BSc Data Science student at Sol Plaatje University, a woman in tech and someone who enjoys exploring new ideas and challenging herself.",
        "I am naturally a little reserved, but I'm always looking for opportunities that push me beyond my comfort zone. University has given me the chance to explore different sides of myself, from technology and creative projects to student societies and community involvement. I'm still discovering what I'm capable of, and I enjoy experiences that allow me to learn, grow and connect with people.",                                                                 
        "WHY POWERPLAY?",
        "I see PowerPlay as an opportunity to combine my creative side with my interest in people and student culture. Being a university student myself, I understand that campus life is about more than lectures and assignments. It's about the experiences, conversations, friendships and moments that make university memorable.",
        "I would love to be part of creating those experiences, bringing fresh ideas, connecting with fellow students and helping brands become part of everyday campus life. I also see this as a chance to build my confidence, meet new people and take on something different..",
      ],
      chips:["Data Science","Innovator","Works well with students","Always playing"] },

    { tag:"LEVEL 2 · COMMUNITY", ride:"horse", game:"run", intro:"Come with me! Let me tell you what I've done. Hop on my horse and let's ride!", title:"Community Impact", flavour:{name:"Mango", c1:"#ffe14a", c2:"#ffb300", photo:"images/mango.webp",
        lines:["A bright tropical fruit blend.","Sunshine in a can for long study days."]},
      body:[
        "I worked with Pusetso ya Setjhaba Community Nutrition Development Center (PYS CNDC), a community organisation in QwaQwa, on the media side of its work.",
        "That work belongs to PYS, so I don't show it here. What I can share is their reference letter, which you can download on the last page."
      ],
      chips:["Community work","Reliable","Meets deadlines","Takes feedback well"] },

    { tag:"LEVEL 3 · DESIGN", ride:"truck", game:"run", intro:"Jump in the Play truck! I'll show you what my team and I designed.", title:"Designs That Won", flavour:{name:"Passion Fruit", c1:"#a974ff", c2:"#5b2bb8", photo:"images/passion.png",
        lines:["Tangy passion fruit with a punch.","A bold purple can for bold days."]},
      body:[
        "BUILT FROM AN IDEA ",
        "I enjoy creating things that have a purpose, especially when they can make someone's experience a little easier. My projects often start with noticing a problem, thinking about what could be done differently, and trying to turn that idea into something practical.",
        "01. Grade 10–12 Mathematics Learning App",
        "I created a mathematics learning application aimed at helping high school learners access learning resources in a more interactive and engaging way. The idea came from wanting to make learning Mathematics feel less intimidating and give learners a space where they could practise, explore topics and access helpful resources outside the classroom.",
        "The application includes topic-based learning, educational games, past examination papers and other learning resources. I wanted to bring together useful tools in one place while making the experience accessible and engaging for learners.",
        "02. Safety & Accountability",
        "Safety & Accountability was a student innovation project developed around the idea of making safety and accountability more accessible through technology. Being part of the project gave me an opportunity to contribute to the development of an idea designed around a real need. The project went on to reach the Top 10 of the 2025 Youth Innovation Challenge in partnership with Absa.",
        "It was an experience that showed me the value of collaboration, user-focused thinking and turning ideas into solutions that could make a difference."
      ],
      chips:["Top 10","Youth Innovation Challenge 2025","Absa","UI & brand design"] },

    { tag:"LEVEL 4 · DATA", ride:"can", game:"catch", intro:"Next, catch the falling bolts. Drag to move, and dodge the bad stuff.", title:"Data Brain, Campus Heart", flavour:{name:"Apple & Kiwi", c1:"#6fe05a", c2:"#0f8a3c", photo:"images/apple.webp",
        lines:["A crisp, fresh apple and kiwi mix.","Sharp and refreshing for a focus boost."]},
      body:[
        "I study Data Science, so naturally, I'm interested in what happens behind the numbers. I enjoy exploring data, spotting patterns and understanding why certain things work better than others.",
        "During my Data Science & Analytics internship, I created three interactive dashboards, which gave me practical experience turning data into insights that are easier to understand and use.",
        "I think this is something I could bring to PowerPlay too. Beyond creating excitement around a campaign, I will  be interested in understanding how students responded, which activities attracted the most attention, and what we could do differently next time. Because sometimes the success of an activation is not just about how many people showed up, but how many actually engaged.",
      ],
      chips:["Python","R","Power BI","Campaign analytics","Clear reporting"] },

    { tag:"LEVEL 5 · CAMPUS PLAYBOOK", ride:"can", game:"flap", intro:"Strap in! Tap to fly the rocket through the gaps.", title:"My Plays for Campus", flavour:{name:"Raspberry", c1:"#ff5c8a", c2:"#b3124a", photo:"images/ras.webp",
        lines:["Sweet berry flavour with a fruity kick."]},
      body:["Three ideas I'd run at Sol Plaatje University. Tap one to open it."],
      ideas:[
        {t:"Exam Season Power-Up", d:"Pop-up stations at the library and residences during exams, with a study-streak leaderboard and prizes for the most consistent study groups."},

function playUpdate(dt){
  if(gameKey()!=='run'){miniUpdate(dt);score=Math.floor(dist)+bonus;updateHud();return}
  speed=(300+Math.min(level,7)*16)*S;
  const dx=speed*dt;
  dist+=dx/(12*S);
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
  if(inv>0)inv-=dt;
  buffer-=dt;

  P.vy+=G()*dt;P.y+=P.vy*dt;
  if(P.y>=groundY){
    if(!P.onGround)burst(P.x+P.w/2,groundY,'#cfd6ff',4,100);
    P.y=groundY;P.vy=0;P.onGround=true;P.jumps=0;
    if(buffer>0){buffer=0;doJump()}
  }else P.onGround=false;

  trailT-=dt;
  if(trailT<=0){
    trailT=0.03;
    parts.push({x:P.x+4*S,y:P.y-P.h*0.5+rnd(-10,10)*S,vx:-speed*0.45,vy:rnd(-20,20),life:.35,max:.35,color:'#ffb347',size:rnd(3,6)*S,g:0,shape:'c',rot:0,vr:0});
  }

  spawnDist-=dx;if(spawnDist<=0)spawnPattern();

  const cx=P.x+P.w/2,cy=P.y-P.h/2,pr=18*S+P.w*0.4;
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.x-=dx;
    if(it.x<-60){items.splice(i,1);continue}
    if(!it.got&&Math.abs(it.x-cx)<pr&&Math.hypot(it.x-cx,it.y-cy)<pr){collect(it);if(state!=='play')return}
  }
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];o.x-=dx;
    if(o.x+o.w<-80){obstacles.splice(i,1);continue}
    if(inv<=0){
      const hx=P.x+P.w*0.24,hw=P.w*0.52,hy=P.y-P.h*0.9,hh=P.h*0.9;
      const ox=o.x+o.w*0.1,ow=o.w*0.8,oy=groundY-o.h*0.88;
      if(hx<ox+ow&&hx+hw>ox&&hy<groundY&&hy+hh>oy){hurt();if(state!=='play')return}
    }
  }
  score=Math.floor(dist)+bonus;
  updateHud();
}

function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0||p.y>H+40){parts.splice(i,1);continue}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
  }
  if(parts.length>700)parts.splice(0,parts.length-700);
}

function update(dt){
  time+=dt;
  const bg=state==='play'?(gameKey()==='run'?speed:0):(state==='menu'?140*S:0);
  scrollX+=bg*dt;
  if(state==='play')playUpdate(dt);
  updateParticles(dt);
  if(banner.t>0)banner.t-=dt;
  if(shake>0)shake-=dt;
}

function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,groundY);
  g.addColorStop(0,'#07071c');g.addColorStop(0.55,'#1a0f4a');g.addColorStop(1,'#7a1d8c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,groundY+2);

  ctx.fillStyle='#fff';

    const x=((st.x*W-scrollX*0.02)%W+W)%W;
    ctx.globalAlpha=0.35+0.45*Math.abs(Math.sin(time*1.5+st.p));
    ctx.fillRect(x,st.y*groundY,st.s,st.s);
  }
  ctx.globalAlpha=1;

  // big glowing play-button "sun"
  const cx=W*0.74,cy=groundY*0.42,r=Math.min(W,H)*0.17*(1+Math.sin(time*2)*0.015);
  const gl=ctx.createRadialGradient(cx,cy,r*0.2,cx,cy,r*2);

  ctx.fillStyle='rgba(255,138,0,.13)';ctx.fill();
  ctx.lineWidth=3*S;ctx.lineJoin='round';ctx.strokeStyle='rgba(255,138,0,.55)';ctx.stroke();

  // skyline layers
  layers.forEach(function(L,li){
    const off=(scrollX*L.par)%L.total;
    ctx.fillStyle=L.tint;
    for(let k=-1;k<=1;k++){
      for(const b of L.bs){
        const x=b.x-off+k*L.total;
        if(x>W||x+b.w<0)continue;
        const h=b.h*S*(li?1:1.15);
        ctx.fillRect(x,groundY-h,b.w,h);
        if(li===1){
          ctx.fillStyle='rgba(255,220,120,.55)';
          const cols=Math.floor(b.w/12),rows=Math.floor(h/16);

  ctx.fillStyle='#0c0a2a';ctx.fillRect(0,groundY,W,H-groundY);
  ctx.strokeStyle='rgba(255,138,0,.28)';ctx.lineWidth=1.5;
  const gs=70*S,go=scrollX%gs;
  ctx.beginPath();

  ctx.stroke();
  ctx.fillStyle='#ff8a00';ctx.fillRect(0,groundY,W,3*S);
  const eg=ctx.createLinearGradient(0,groundY,0,groundY+26*S);
  eg.addColorStop(0,'rgba(255,138,0,.35)');eg.addColorStop(1,'rgba(255,138,0,0)');
  ctx.fillStyle=eg;ctx.fillRect(0,groundY,W,26*S);
}

  ctx.textAlign='center';ctx.lineWidth=7*S;ctx.lineJoin='round';
  ctx.strokeStyle='#10122e';ctx.strokeText(banner.text,0,0);
  ctx.fillStyle='#ff8a00';ctx.fillText(banner.text,0,0);
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake>0&&!reduceMotion){const k=shake/0.35;ctx.translate(rnd(-1,1)*8*S*k,rnd(-1,1)*8*S*k)}
  ctx.clearRect(-20,-20,W+40,H+40);
  drawBackground();
  if(gameKey()==='run'){items.forEach(drawItem);obstacles.forEach(drawObstacle);drawPlayer()}else drawMini();
  drawParticles();
  ctx.restore();
  drawBanner();
  if(combo>=3&&state==='play'){
    ctx.font='900 '+Math.round(20*S)+'px Impact,sans-serif';ctx.textAlign='left';ctx.fillStyle='#ffb300';
    ctx.fillText('x'+combo+' COMBO',P.x,P.y-P.h-14*S);
  }
}

/* ---------- HUD ---------- */
function buildProg(){
  const p=$('prog');p.innerHTML='';
  for(let i=0;i<N;i++){const d=document.createElement('div');d.className='seg'+(cleared[i]?' on':(i===level&&!endless?' cur':''));p.appendChild(d)}
}
function updateHud(force){
  const key=[lives,cells,score,level,endless].join('|');
  if(!force&&key===lastHud)return;lastHud=key;
  $('hearts').textContent='♥'.repeat(Math.max(lives,0))+'♡'.repeat(Math.max(3-lives,0));
  $('cellsTxt').textContent='⚡ '+cells;
  $('scoreTxt').textContent='SCORE '+score;
  $('lvlTxt').textContent=endless?'ENDLESS MODE':'LEVEL '+Math.min(level+1,N)+' / '+N;
  buildProg();
}

let rcTimers=[];
function clearRecharge(){rcTimers.forEach(clearTimeout);rcTimers=[]}
function showDead(){
  if(state!=='dead')return;
  clearRecharge();
  const html='<span class="tag">OUT OF ENERGY</span><h2 id="rcTitle">Feeling tired??</h2>'+
    '<div class="scene" id="rcScene">'+RC_SVG+'<div class="bub bubL" id="rcL">So tired&hellip;</div><div class="bub bubR" id="rcR" hidden></div><div class="sfx" id="rcSfx" hidden>QA!!!</div></div>'+
    '<div class="rchearts" id="rcHearts"><span>&#9825;</span><span>&#9825;</span><span>&#9825;</span></div><div class="rclabel" id="rcLabel"></div>';
  showModal(html,[['Back in the game ▶','primary',function(){respawn()}],['Skip','ghost',function(){finishRecharge(false)}]]);
  const b=$('modalCard').querySelectorAll('.btn');b[0].hidden=true;
  const sc=$('rcScene'),L=$('rcL'),R=$('rcR');
  const at=function(ms,fn){rcTimers.push(setTimeout(fn,ms))};
  at(900,function(){L.hidden=true;sc.classList.add('a1')});
  at(2300,function(){R.hidden=false;R.textContent='Tired?? Have a Play!'});
  at(3700,function(){R.hidden=true;sc.classList.add('a2')});
  at(4600,function(){
    sc.classList.add('a3');
    $('rcSfx').hidden=false;
    tone(1300,.07,'square',.09,-900);          // the "pop"
    for(let i=0;i<7;i++)tone(2400+i*220,.18,'triangle',.02,-400,.06+i*.05);  // the fizz
    tone(500,.5,'sine',.05,600);
  });
  at(5900,function(){finishRecharge(true)});

function finishRecharge(natural){
  clearRecharge();
  const sc=$('rcScene');if(!sc)return;
  const L=$('rcL'),R=$('rcR');
  const sx=$('rcSfx');if(sx)sx.hidden=true;
  sc.classList.add('a1','a2','a3','a4');
  R.hidden=true;L.hidden=false;L.textContent='Thank you, '+(PROFILE.helperName||'friend')+'!';
  $('rcTitle').textContent='Recharged!';
  const hs=$('rcHearts').children;
  for(let i=0;i<3;i++){(function(i){rcTimers.push(setTimeout(function(){hs[i].textContent='♥';hs[i].classList.add('on');tone(600+i*150,.12,'triangle',.07)},natural?200+i*300:0))})(i)}
  $('rcLabel').textContent='LIVES BACK TO 3';

function showPause(){
  showModal('<span class="tag">PAUSED</span><h2>Take Five</h2><p>Your run is safe. Ready when you are.</p>',
    [['Resume','primary',resume],['Trophy room','ghost',function(){hideModal();openRoom()}],['Restart','ghost',function(){hideModal();startGame()}]]);
}
function pauseGame(){if(state==='play'){state='pause';showPause()}}

function buildRoom(){
  const g=$('roomGrid');g.innerHTML='';
  PROFILE.cards.forEach(function(c,i){
    const open=cleared[i]||viewAll;
    const b=document.createElement('button');b.className='tile'+(open?'':' locked');
    b.innerHTML='<b>'+(i+1)+'</b><span>'+esc(sub(c.title).replace(/\[\[.+?\]\]/g,''))+'</span>';
    b.addEventListener('click',function(){
      if(open)openCard(i,'room');
      else{tone(150,.2,'square',.06);b.animate&&b.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:220})}
    });
    g.appendChild(b);
  });
  $('roomUnlock').hidden=viewAll||cleared.every(Boolean);
  $('roomDocs').innerHTML=docsHtml();
}
function openRoom(){
  if(state==='play')state='pause';
  buildRoom();$('start').hidden=true;$('room').hidden=false;
}
function closeRoom(){
  $('room').hidden=true;
  if(state==='menu')$('start').hidden=false;
  else if(state==='pause')showPause();
}

/* ---------- flow ---------- */
function startGame(){
  clearRecharge();ensureAudio();
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  $('start').hidden=true;$('room').hidden=true;hideModal();$('hud').hidden=false;
  level=0;cells=0;checkpointCells=0;lives=3;dist=0;bonus=0;score=0;combo=0;endless=false;
  cleared=PROFILE.cards.map(()=>false);applyRide();
  obstacles.length=0;items.length=0;parts.length=0;
  spawnDist=W*0.9;inv=0;shake=0;buffer=0;
  P.y=groundY;P.vy=0;P.onGround=true;P.jumps=0;
  setHint();
  state='play';updateHud(true);say('GO!',1);
  setTimeout(function(){$('hint').hidden=true},9000);
}

  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    if(state==='play'){e.preventDefault();ensureAudio();if(!e.repeat)pressJump()}
  }else if(e.code==='KeyP'||e.code==='Escape'){
    if(state==='play')pauseGame();
    else if(state==='pause'&&$('room').hidden&&!$('modal').hidden){resume()}
  }
});

  const dt=Math.min(0.033,Math.max(0,(ts-last)/1000));last=ts;
